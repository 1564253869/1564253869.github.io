<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>地精恋物语</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background-color: #000;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: background-image 1s ease;
        }

        #character {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            max-height: 65vh;
            z-index: 10;
            transition: opacity 0.5s ease;
            max-width: 90%;
        }

        #dialogue-box {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            padding: 12px;
            color: white;
            z-index: 20;
            border: 2px solid #ffcc00;
        }

        #character-name {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 6px 12px;
            border-radius: 10px;
            z-index: 20;
            font-weight: bold;
            border: 1px solid #ffcc00;
            font-size: 14px;
        }

        #love-bar {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 150px;
            height: 25px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            z-index: 20;
            border: 1px solid #ffcc00;
            overflow: hidden;
        }

        #love-fill {
            height: 100%;
            width: 50%;
            background: linear-gradient(to right, #ff6b6b, #ffcc00, #6bffb8);
            transition: width 1s ease;
        }

        #love-text {
            position: absolute;
            top: 3px;
            right: 5px;
            color: white;
            font-weight: bold;
            z-index: 21;
            font-size: 12px;
        }

        #options-container {
            position: absolute;
            bottom: 120px;
            left: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
        }

        .option-btn {
            background: rgba(255, 204, 0, 0.9);
            color: black;
            border: none;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid #fff;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(1.02);
        }

        .option-btn:disabled {
            background: rgba(100, 100, 100, 0.5);
            cursor: not-allowed;
            transform: none;
        }

        #title-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
        }

        #title-screen h1 {
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #title-screen p {
            font-size: 16px;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
        }

        #start-btn {
            background: rgba(255, 204, 0, 0.9);
            color: black;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #start-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(1.05);
        }

        .hidden {
            display: none !important;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 90;
            color: white;
            text-align: center;
            padding: 20px;
        }

        #game-over-screen h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #ffcc00;
        }

        #game-over-screen p {
            font-size: 16px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        #restart-btn {
            background: rgba(255, 204, 0, 0.9);
            color: black;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        #restart-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(1.05);
        }

        #audio-player {
            position: absolute;
            bottom: 10px;
            right: 10px;
            z-index: 30;
            opacity: 0.7;
        }

        #audio-player:hover {
            opacity: 1;
        }
        
        /* 移动端适配 */
        @media screen and (max-width: 768px) {
            #dialogue-text {
                font-size: 14px;
                line-height: 1.4;
            }
            
            .option-btn {
                font-size: 13px;
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="background"></div>
        
        <div id="character-name">地精</div>
        
        <div id="love-bar">
            <div id="love-fill" style="width: 50%;"></div>
            <div id="love-text">好感度: 50%</div>
        </div>
        
        <img id="character" src="./images/地精角色1_20260216211713.jpg" alt="地精角色">
        
        <div id="dialogue-box">
            <p id="dialogue-text">点击开始游戏，与地精展开一段特别的校园生活...</p>
        </div>
        
        <div id="options-container">
            <!-- 选项按钮将通过JavaScript动态生成 -->
        </div>
        
        <div id="title-screen">
            <h1>地精恋物语</h1>
            <p>与神秘的地精展开一段特别的校园生活<br>运用你的智慧提升好感度，获得不同结局！</p>
            <button id="start-btn">开始游戏</button>
        </div>
        
        <div id="game-over-screen" class="hidden">
            <h2 id="ending-title">结局标题</h2>
            <p id="ending-description">结局描述</p>
            <button id="restart-btn">重新开始</button>
        </div>
        
        <audio id="bgm" loop>
            <source src="./audio/椎名林檎 - 丸ノ内サディスティック (2019 Mix).mp3" type="audio/mpeg">
        </audio>
        
        <audio id="good-ending-audio">
            <source src="./audio/椎名林檎 - 丸ノ内サディスティック (2019 Mix).mp3" type="audio/mpeg">
        </audio>
        
        <div id="audio-player">
            <button id="play-pause-btn">🔊</button>
        </div>
    </div>

    <script>
        // 游戏数据
        const gameData = {
            love: 50,
            currentScene: 0,
            isTransition: false, // 是否为过渡场景
            isPlaying: false,
            bgm: document.getElementById('bgm'),
            goodEndingAudio: document.getElementById('good-ending-audio'),
            
            // 角色图片数组
            characterImages: [
                './images/地精角色1_20260216211713.jpg',
                './images/地精角色2_20260216211734.jpg',
                './images/地精角色3_20260216211756.jpg',
                './images/地精角色4_20260216211817.jpg',
                './images/地精角色5_20260216211837.jpg'
            ],
            
            // 背景图片数组
            backgrounds: {
                classroom: './images/教室背景_20260216211857.jpg',
                outdoor: './images/室外背景_20260216211920.jpg',
                classroomInside: './images/教室内背景_20260216211942.jpg'
            },
            
            // 游戏场景，包含选项场景和过渡场景
            scenes: [
                // 第一幕：初遇 (选项场景)
                {
                    type: 'choice', // 选项场景
                    dialogue: "开学第一天，我注意到班级里有个独特的男生。他总是独自一人。同学们说他叫地精，是个暗区突围！！高手。",
                    options: [
                        { text: "默默观察他，不打扰他的世界", effect: 2, nextDialogue: "地精似乎察觉到了你的目光，抬头看了你一眼，又低下头。" },
                        { text: "主动走过去打招呼", effect: 5, nextDialogue: "地精有些惊讶，推了推眼镜：'你...你好，我是地精，地精地精地？'" },
                        { text: "向同学打听他的情况", effect: -2, nextDialogue: "同学们纷纷议论：'他总是在玩那个叫暗区突围的游戏'，'好像生物不太好'。" }
                    ],
                    background: 'classroomInside',
                    characterImage: 0
                },
                // 第一幕过渡：观察后的反应
                {
                    type: 'transition', // 过渡场景
                    dialogue: "几天过去了，你发现自己总是不自觉地关注着地精的一举一动。他上课时专注睡觉的样子，午休时独自坐在角落睡觉的身影，都让你感到莫名的心动。",
                    background: 'classroom',
                    characterImage: 0
                },
                // 第二幕：生物课 (选项场景)
                {
                    type: 'choice',
                    dialogue: "生物课上，霍伟老登提问细胞分裂的过程。地精被点名回答，但他显然没听课，尴尬地站在那里。",
                    options: [
                        { text: "小声提醒他答案", effect: 5, nextDialogue: "地精感激地看了你一眼，顺利回答了问题。霍伟满意地点头。" },
                        { text: "替他回答，帮他解围", effect: 7, nextDialogue: "你举手补充了答案，霍伟表扬了你，地精向你投来感激的目光。" },
                        { text: "偷偷递纸条给他", effect: 3, nextDialogue: "地精接过纸条，成功回答了问题，但被霍伟警告不要传纸条。" }
                    ],
                    background: 'classroom',
                    characterImage: 1
                },
                // 第二幕过渡：课后交流
                {
                    type: 'transition',
                    dialogue: "下课后，地精主动走到你身边，低声说了句'谢谢'。这是他第一次主动和你说话，你感到心跳加速。",
                    background: 'classroom',
                    characterImage: 1
                },
                // 第三幕：课间交流 (选项场景)
                {
                    type: 'choice',
                    dialogue: "课间休息时，你看到地精还在座位上和人聊手机游戏。",
                    options: [
                        { text: "好奇地问他在聊什么游戏", effect: 10, nextDialogue: "地精眼睛一亮：'是暗区突围！你要不要也试试'他显得很兴奋。" },
                        { text: "建议他出去活动一下", effect: -3, nextDialogue: "地精摇摇头：'不用了，我还要打游戏，那个老登布置的作业还没写完...'（挎着b脸）" },
                        { text: "分享一些有趣的事情", effect: 5, nextDialogue: "地精抬起头：'嗯...听起来挺有意思的。'" }
                    ],
                    background: 'classroom',
                    characterImage: 1
                },
                // 第三幕过渡：共同话题
                {
                    type: 'transition',
                    dialogue: "通过交谈，你发现地精对游戏有着深入的了解，他眼中闪烁着热情的光芒，这和平时沉默寡言的他完全不同。",
                    background: 'classroom',
                    characterImage: 2
                },
                // 第四幕：食堂相遇 (选项场景)
                {
                    type: 'choice',
                    dialogue: "午餐时间，你在食堂排队打饭，意外发现地精也在队伍里。",
                    options: [
                        { text: "主动和他一起排队聊天", effect: 8, nextDialogue: "地精有些紧张但还是和你聊了起来：'你平时都玩什么游戏？'" },
                        { text: "远远地看着他，没有靠近", effect: 0, nextDialogue: "地精独自吃完饭，很快离开了食堂。" },
                        { text: "邀请他坐到你旁边", effect: 10, nextDialogue: "地精犹豫了一下，最终同意了：'好...好吧，不过我吃饭比较地精地精地精。'" }
                    ],
                    background: 'classroom',
                    characterImage: 2
                },
                // 第四幕过渡：友谊加深
                {
                    type: 'transition',
                    dialogue: "从那天起，地精开始偶尔和你一起吃饭。虽然话不多，但你能感受到他内心的温暖。你们之间的距离在慢慢拉近。",
                    background: 'classroom',
                    characterImage: 2
                },
                // 第五幕：114514梗 (选项场景)
                {
                    type: 'choice',
                    dialogue: "下午自习课，地精在笔记本上写写画画，似乎在记录什么。",
                    options: [
                        { text: "凑近看看他在写什么", effect: 7, nextDialogue: "地精迅速合上笔记本：'没...没什么，就是随便写写。'" },
                        { text: "突然说出'1BF52'这个数字", effect: 15, nextDialogue: "地精猛地抬起头，眼中闪着惊喜：'潘博文？'他变得异常兴奋。" },
                        { text: "问他要不要一起去买饮料", effect: 5, nextDialogue: "地精摇摇头：'死妈济南一中超市里有个鸡巴'" }
                    ],
                    background: 'classroomInside',
                    characterImage: 2
                },
                // 第五幕过渡：共鸣时刻
                {
                    type: 'transition',
                    dialogue: "得知你也懂得网络文化，地精打开了心扉。他开始和你分享更多有趣的事情，你们的友谊变得更加深厚。",
                    background: 'classroom',
                    characterImage: 3
                },
                // 第六幕：放学时光 (选项场景)
                {
                    type: 'choice',
                    dialogue: "放学了，大部分同学都走了，地精却还在教室里。",
                    options: [
                        { text: "问他为什么还不回家", effect: 8, nextDialogue: "地精叹了口气：'家里人都死光了，回去也是一个人，不如在学校待着。'" },
                        { text: "提议一起去网吧", effect: 10, nextDialogue: "地精眼睛一亮：'网吧？可以啊，我知道附近有个不错的地方。'" },
                        { text: "邀请他参加课外活动", effect: 5, nextDialogue: "地精摇摇头：'操你妈，没活。'" }
                    ],
                    background: 'classroom',
                    characterImage: 0
                },
                // 第六幕过渡：深入了解
                {
                    type: 'transition',
                    dialogue: "通过交谈，你了解到地精的家庭情况。他父母死光了，所以他习惯了独处。你开始想要更多地陪伴他。",
                    background: 'outdoor',
                    characterImage: 0
                },
                // 第七幕：游戏讨论 (选项场景)
                {
                    type: 'choice',
                    dialogue: "在网吧，你和地精一起玩了一款新游戏。",
                    options: [
                        { text: "称赞他的操作技巧", effect: 12, nextDialogue: "地精谦虚地笑了笑：'还行吧，毕竟献祭了家人。'" },
                        { text: "请教他游戏技巧", effect: 10, nextDialogue: "地精耐心地教你：'菜逼'" },
                        { text: "抱怨游戏太难", effect: -5, nextDialogue: "地精有些失望：'6'" }
                    ],
                    background: 'classroom',
                    characterImage: 3
                },
                // 第七幕过渡：默契配合
                {
                    type: 'transition',
                    dialogue: "在游戏里，你们配合得非常默契。地精的脸上露出了久违的笑容，你们的友谊在游戏中得到了升华。",
                    background: 'classroom',
                    characterImage: 3
                },
                // 第八幕：生物老师话题 (选项场景)
                {
                    type: 'choice',
                    dialogue: "回家路上，你们聊起了今天的生物课。",
                    options: [
                        { text: "提到生物老师的严格", effect: -10, nextDialogue: "地精立刻变脸：'别提那个霍伟老登了'" },
                        { text: "问他生物课有什么困难", effect: 5, nextDialogue: "地精低头：'很多地方都不懂，但不想麻烦别人。'" },
                        { text: "转移话题到游戏上", effect: 8, nextDialogue: "地精立刻活跃起来：'对了，你知道最近游戏有什么新活动吗？'" }
                    ],
                    background: 'outdoor',
                    characterImage: 0
                },
                // 第八幕过渡：情感波动
                {
                    type: 'transition',
                    dialogue: "每当提及生物课相关的话题，地精的情绪就会变得低落。你决定要帮助他克服这个困扰，让他知道你始终支持他。",
                    background: 'outdoor',
                    characterImage: 1
                },
                // 第九幕：暧昧举动 (选项场景)
                {
                    type: 'choice',
                    dialogue: "周末，你和地精在公园散步。夕阳西下，气氛很美好。",
                    options: [
                        { text: "赞美夕阳的美景", effect: 5, nextDialogue: "地精看了看天空：'确实很美...不过兄弟你好香。'（脸红）" },
                        { text: "悄悄靠近他，轻抚他的头发", effect: 20, nextDialogue: "地精身体一颤，脸红得像苹果：'哦齁齁齁齁齁。" },
                        { text: "开玩笑说他应该多交朋友", effect: 3, nextDialogue: "地精低头：'我是你爹。'" }
                    ],
                    background: 'outdoor',
                    characterImage: 2
                },
                // 第九幕过渡：心动时刻
                {
                    type: 'transition',
                    dialogue: "那一刻，你们的眼神交汇，空气中弥漫着甜蜜的气息。你感觉到彼此的心跳都在加速，一种特殊的情感在心中萌芽。",
                    background: 'outdoor',
                    characterImage: 2
                },
                // 第十幕：生物作业 (选项场景)
                {
                    type: 'choice',
                    dialogue: "晚上，地精在QQ上发消息说生物作业不会做。",
                    options: [
                        { text: "主动提出帮他解答", effect: 10, nextDialogue: "地精感激地说：'真的吗？你人太好了！'但他还是有些犹豫。" },
                        { text: "建议他去看教学视频", effect: 5, nextDialogue: "地精回复：'我试过，但总是注意力不集中...'" },
                        { text: "说生物作业太简单了", effect: -10, nextDialogue: "地精回复：'说得轻松...你不知道我有多讨厌生物课。'" }
                    ],
                    background: 'classroom',
                    characterImage: 1
                },
                // 第十幕过渡：贴心关怀
                {
                    type: 'transition',
                    dialogue: "你耐心地为地精讲解生物题目，他认真地听着。渐渐地，他的生物成绩有所提高，更重要的是，你们的关系也更进一步。",
                    background: 'classroom',
                    characterImage: 1
                },
                // 第十一幕：自慰话题 (选项场景)
                {
                    type: 'choice',
                    dialogue: "深夜，地精在群里发了一张游戏截图。",
                    options: [
                        { text: "夸奖他的游戏成就", effect: 10, nextDialogue: "地精回复：'原神牛逼'" },
                        { text: "问他为什么这么晚还不睡", effect: 7, nextDialogue: "地精：'睡不着，习惯了晚上卢观，这是我的自慰方式。'" },
                        { text: "建议他早点休息", effect: -3, nextDialogue: "地精：'666你爹找你聊天呢'" }
                    ],
                    background: 'classroom',
                    characterImage: 3
                },
                // 第十一幕过渡：深夜谈心
                {
                    type: 'transition',
                    dialogue: "你告诉地精，有人在关心着他，让他不要总是一个人承受压力。从此，你们经常深夜聊天，分享彼此的内心世界。",
                    background: 'classroom',
                    characterImage: 3
                },
                // 第十二幕：美女话题 (选项场景)
                {
                    type: 'choice',
                    dialogue: "你和地精聊起网上的热门话题。",
                    options: [
                        { text: "分享一张美女网红的照片", effect: 15, nextDialogue: "地精评论：'确实不错...不过我还是更关注她的胸。'" },
                        { text: "讨论明星八卦", effect: 5, nextDialogue: "地精兴趣不大：'我对这些不太感兴趣。'" },
                        { text: "分享搞笑视频", effect: 8, nextDialogue: "地精笑了：'我的刀盾？'" }
                    ],
                    background: 'classroomInside',
                    characterImage: 4
                },
                // 第十二幕过渡：价值观契合
                {
                    type: 'transition',
                    dialogue: "你发现地精虽然喜欢游戏和网络文化，但他也有着独特的审美观和价值观。你们的三观逐渐趋于一致。",
                    background: 'classroom',
                    characterImage: 4
                },
                // 第十三幕：柳科企话题 (选项场景)
                {
                    type: 'choice',
                    dialogue: "同学群有人在讨论某个品牌的话题。",
                    options: [
                        { text: "附和大家的讨论", effect: 0, nextDialogue: "地精没有参与讨论，默默地退出了群聊。" },
                        { text: "提到柳科企的内裤品牌", effect: -20, nextDialogue: "地精立刻生气：'啊？！谁提这个的？好恶心！'他退出了群聊。" },
                        { text: "转移话题到游戏上", effect: 10, nextDialogue: "地精：'对，游戏里今天有新活动，要不要一起？'气氛重新活跃起来。" }
                    ],
                    background: 'classroom',
                    characterImage: 0
                },
                // 第十三幕过渡：保护他的底线
                {
                    type: 'transition',
                    dialogue: "你学会了避免触碰地精的雷区，尊重他的底线。这让你们的友谊更加稳固，他也更加信任你。",
                    background: 'classroom',
                    characterImage: 0
                },
                // 第十四幕：生物成绩 (选项场景)
                {
                    type: 'choice',
                    dialogue: "生物成绩公布了，地精考得很不理想。",
                    options: [
                        { text: "安慰他下次会更好", effect: 10, nextDialogue: "地精眼眶有些湿润：'谢谢你...很少有人会安慰我。'" },
                        { text: "建议他找家教补习", effect: -10, nextDialogue: "地精情绪激动：'我不想补习，一想到生物就烦！'" },
                        { text: "告诉他成绩不是最重要的", effect: 15, nextDialogue: "地精看着你：'你真的这么认为吗？'眼中有了光芒。" }
                    ],
                    background: 'classroom',
                    characterImage: 1
                },
                // 第十四幕过渡：成长与支持
                {
                    type: 'transition',
                    dialogue: "在你的鼓励下，地精逐渐改变了对生物课的态度。虽然成绩提升缓慢，但他不再逃避，而是勇敢面对。",
                    background: 'classroom',
                    characterImage: 1
                },
                // 第十五幕：最终选择 (选项场景)
                {
                    type: 'choice',
                    dialogue: "学期结束，你意识到自己已经深深喜欢上了地精。现在是你表达心意的时候了。",
                    options: [
                        { text: "告诉他你的真实感受", effect: 20, nextDialogue: "地精震惊地看着你，随后露出了温暖的笑容：'我...我也一直在注意你...'" },
                        { text: "邀请他假期继续一起玩游戏", effect: 15, nextDialogue: "地精害羞地点头：'好啊，不过不要告诉别人我们经常一起玩。'" },
                        { text: "承诺会一直支持他的兴趣爱好", effect: 18, nextDialogue: "地精感动得几乎要哭：'从来没有人为我考虑这么多...'" }
                    ],
                    background: 'outdoor',
                    characterImage: 4
                }
            ]
        };

        // DOM 元素
        const dialogueText = document.getElementById('dialogue-text');
        const optionsContainer = document.getElementById('options-container');
        const characterImg = document.getElementById('character');
        const backgroundDiv = document.getElementById('background');
        const loveFill = document.getElementById('love-fill');
        const loveText = document.getElementById('love-text');
        const titleScreen = document.getElementById('title-screen');
        const startBtn = document.getElementById('start-btn');
        const gameOverScreen = document.getElementById('game-over-screen');
        const endingTitle = document.getElementById('ending-title');
        const endingDescription = document.getElementById('ending-description');
        const restartBtn = document.getElementById('restart-btn');
        const playPauseBtn = document.getElementById('play-pause-btn');

        // 更新好感度显示
        function updateLoveBar() {
            const percentage = Math.max(0, Math.min(100, gameData.love));
            loveFill.style.width = percentage + '%';
            loveText.textContent = `好感度: ${Math.round(percentage)}%`;
            
            // 根据好感度改变颜色
            if (percentage >= 80) {
                loveFill.style.background = 'linear-gradient(to right, #ff6b6b, #ffcc00, #6bffb8)';
            } else if (percentage >= 50) {
                loveFill.style.background = 'linear-gradient(to right, #ff6b6b, #ffcc00)';
            } else {
                loveFill.style.background = 'linear-gradient(to right, #6bffb8, #ff6b6b)';
            }
        }

        // 显示场景
        function showScene(sceneIndex) {
            if (sceneIndex >= gameData.scenes.length) {
                showEnding();
                return;
            }
            
            const scene = gameData.scenes[sceneIndex];
            
            // 更新背景和角色图片
            backgroundDiv.style.backgroundImage = `url('${gameData.backgrounds[scene.background]}')`;
            characterImg.src = gameData.characterImages[scene.characterImage];
            
            // 根据场景类型显示内容
            if (scene.type === 'choice') {
                // 选项场景：显示对话和选项
                dialogueText.textContent = scene.dialogue;
                
                // 清空现有选项
                optionsContainer.innerHTML = '';
                
                // 创建选项按钮
                scene.options.forEach((option, index) => {
                    const button = document.createElement('button');
                    button.className = 'option-btn';
                    button.textContent = option.text;
                    button.onclick = () => handleOptionClick(option, sceneIndex);
                    optionsContainer.appendChild(button);
                });
            } else if (scene.type === 'transition') {
                // 过渡场景：只显示对话，无选项
                dialogueText.textContent = scene.dialogue;
                
                // 清空选项容器
                optionsContainer.innerHTML = '';
                
                // 自动进入下一场景
                setTimeout(() => {
                    gameData.currentScene++;
                    if (gameData.currentScene < gameData.scenes.length) {
                        showScene(gameData.currentScene);
                    } else {
                        showEnding();
                    }
                }, 3000); // 3秒后自动切换
            }
        }

        // 处理选项点击
        function handleOptionClick(option, sceneIndex) {
            // 更新好感度
            gameData.love += option.effect;
            updateLoveBar();
            
            // 显示选项结果对话
            dialogueText.textContent = option.nextDialogue;
            
            // 禁用所有选项按钮
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
            });
            
            // 延迟进入下一场景
            setTimeout(() => {
                gameData.currentScene++;
                if (gameData.currentScene < gameData.scenes.length) {
                    showScene(gameData.currentScene);
                } else {
                    setTimeout(showEnding, 2000);
                }
            }, 2000);
        }

        // 显示结局
        function showEnding() {
            let endingType, title, description;
            
            if (gameData.love >= 85) {
                endingType = 'good';
                title = '完美结局 - 永远在一起';
                description = '经过一学期的相处，地精对你产生了深深的爱意。他终于放下了心中的防备，愿意与你分享他的世界。你们成为了最亲密的恋人，他承诺永远只为你一个人打游戏，只为你一个人露出笑容。"兄弟，屁眼借我用一下"';
                
                // 播放好结局音乐
                gameData.goodEndingAudio.play().catch(e => console.log('音频播放失败:', e));
            } else if (gameData.love >= 50) {
                endingType = 'normal';
                title = '普通结局 - 好朋友';
                description = '你们成为了最好的朋友，地精愿意向你敞开心扉，分享他的兴趣爱好和日常生活。虽然没有成为给，但这份深厚的友谊也弥足珍贵。他还会找你一起玩游戏，一起度过高三的时光。';
            } else {
                endingType = 'bad';
                title = '坏结局 - 渐行渐远';
                description = '由于你多次触犯地精的雷区，他对你的印象越来越差。最终，他开始疏远你，不再与你交流。你失去了了解他内心世界的机会，只能远远地看着他继续沉浸在自己的游戏中。"死妈了，滚"';
            }
            
            endingTitle.textContent = title;
            endingDescription.textContent = description;
            gameOverScreen.classList.remove('hidden');
        }

        // 开始游戏
        function startGame() {
            titleScreen.classList.add('hidden');
            gameData.love = 50; // 重置好感度
            gameData.currentScene = 0; // 重置场景
            updateLoveBar();
            showScene(0);
        }

        // 重新开始游戏
        function restartGame() {
            gameOverScreen.classList.add('hidden');
            gameData.love = 50; // 重置好感度
            gameData.currentScene = 0; // 重置场景
            updateLoveBar();
            showScene(0);
        }

        // 音频控制
        function toggleAudio() {
            if (gameData.isPlaying) {
                gameData.bgm.pause();
                playPauseBtn.textContent = '🔇';
            } else {
                gameData.bgm.play().catch(e => console.log('BGM播放失败:', e));
                playPauseBtn.textContent = '🔊';
            }
            gameData.isPlaying = !gameData.isPlaying;
        }

        // 事件监听器
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', restartGame);
        playPauseBtn.addEventListener('click', toggleAudio);

        // 初始化好感度显示
        updateLoveBar();
    </script>
</body>
</html>
