                    text: "“我...我喜欢你。”地精终于说出了这句话，脸上泛起红晕。",
                    options: [
                        { text: "我也喜欢你，地精", value: 10, condition: 'good', message: "地精眼中充满喜悦" },
                        { text: "我很感动，但我需要时间考虑", value: 0, message: "地精点点头，表示理解" },
                        { text: "我们只适合做朋友", value: -10, condition: 'bad', message: "地精的表情瞬间黯淡" }
                    ]
                }
            ],
            
            endings: {
                perfect: {
                    title: "完美结局 - 永恒的羁绊",
                    message: "经过长时间的相处，你完全理解了地精的独特爱好。你们不仅成为了情侣，还一起探索各种小众文化。每当夜深人静时，你们会一起玩游戏、讨论网络梗，有时也会做一些私密的小事。地精说，你是他遇到的唯一能够理解他全部的人。你们的爱情如同樱花般美丽，永远绽放。",
                    bg: 'outdoors'
                },
                good: {
                    title: "幸福结局 - 心意相通",
                    message: "你成功赢得了地精的心。虽然不能完全理解他的所有爱好，但你愿意尝试接受。你们经常一起玩游戏，在网络世界中寻找乐趣。地精偶尔会跟你分享一些小众的网络文化，而你也学会了欣赏他的独特之处。你们的关系稳定而甜蜜，虽然偶有分歧，但总能互相包容。",
                    bg: 'classroom'
                },
                neutral: {
                    title: "普通结局 - 友谊长存",
                    message: "你们成为了很好的朋友。虽然你和地精之间有好感，但始终无法跨越最后一步。你们依然会一起玩游戏，分享网络趣事，但关系止步于友谊。有时候你会想，如果当初的选择不同，结果会不会不一样呢？无论如何，这段经历让你们都成长了。",
                    bg: 'classroom'
                },
                bad: {
                    title: "遗憾结局 - 错失良缘",
                    message: "由于多次选择不当，你和地精的关系逐渐疏远。他对你的兴趣减退，开始回避与你交流。你试图挽回，但地精已经对你失去了信任。最终，你们变成了陌生人。毕业时，地精没有向你道别就离开了。也许这就是命运，错过的终究是错过的。",
                    bg: 'classroom'
                },
                disaster: {
                    title: "悲剧结局 - 形同陌路",
                    message: "你的选择严重伤害了地精的感情。他开始讨厌你，认为你是个虚伪的人。你们之间的每一次互动都充满了火药味。地精甚至在同学面前贬低你，说你是个不懂装懂的伪君子。你试图解释，但他已经不愿意再听。这段本可能美好的感情，就这样彻底破碎了。",
                    bg: 'afterSchool'
                }
            }
        };

        // DOM元素
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const endingScreen = document.getElementById('ending-screen');
        const endingTitle = document.getElementById('ending-title');
        const endingMessage = document.getElementById('ending-message');
        const restartBtn = document.getElementById('restart-btn');
        const background = document.getElementById('background');
        const character = document.getElementById('character');
        const characterExpression = document.getElementById('character-expression');
        const dialogueText = document.getElementById('dialogue-text');
        const optionsContainer = document.getElementById('options-container');
        const heartsDisplay = document.getElementById('hearts-display');
        const heartsPercentage = document.getElementById('hearts-percentage');
        const progressBar = document.getElementById('progress-bar');
        const bgm = document.getElementById('bgm');
        const choiceSound = document.getElementById('choice-sound');
        const endingSound = document.getElementById('ending-sound');
        const sceneIndicator = document.getElementById('scene-indicator');
        const eventTrigger = document.getElementById('event-trigger');
        const transitionOverlay = document.getElementById('transition-overlay');

        // 初始化游戏
        function initGame() {
            updateHearts();
            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', resetGame);
            eventTrigger.addEventListener('click', advanceDialogue);
        }

        // 开始游戏
        function startGame() {
            gameData.gameStarted = true;
            gameData.gamePhase = 1;
            startScreen.style.display = 'none';
            bgm.volume = 0.3;
            bgm.play().catch(e => console.log("Audio play failed:", e));
            nextStoryPoint();
        }

        // 下一个故事点
        function nextStoryPoint() {
            if (gameData.storyProgress >= gameData.storyLines.length) {
                showEnding();
                return;
            }
            
            const storyPoint = gameData.storyLines[gameData.storyProgress];
            
            // 更新场景
            background.style.backgroundImage = `url('${gameData.backgrounds[storyPoint.background]}')`;
            character.style.backgroundImage = `url('${gameData.characterImages[storyPoint.character]}')`;
            characterExpression.style.backgroundImage = `url('${gameData.characterImages[storyPoint.character]}')`;
            
            // 更新场景指示器
            if (storyPoint.background === 'classroom') {
                sceneIndicator.textContent = '场景：教室内';
            } else if (storyPoint.background === 'afterSchool') {
                sceneIndicator.textContent = '场景：放学后';
            } else if (storyPoint.background === 'outdoors') {
                sceneIndicator.textContent = '场景：室外';
            }
            
            // 显示对话
            dialogueText.textContent = storyPoint.text;
            
            // 如果有选项，显示选项；否则等待点击继续
            if (storyPoint.options) {
                optionsContainer.style.display = 'block';
                dialogueText.style.height = '70px';
                
                // 生成选项
                optionsContainer.innerHTML = '';
                storyPoint.options.forEach((option, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = option.text;
                    btn.addEventListener('click', () => makeChoice(option, index));
                    optionsContainer.appendChild(btn);
                });
            } else {
                optionsContainer.style.display = 'none';
                dialogueText.style.height = '100px';
            }
            
            gameData.storyProgress++;
        }

        // 点击对话框继续
        function advanceDialogue() {
            if (gameData.gameStarted && !optionsContainer.style.display || optionsContainer.style.display === 'none') {
                nextStoryPoint();
            }
        }

        // 做出选择
        function makeChoice(option, index) {
            choiceSound.currentTime = 0;
            choiceSound.play().catch(e => console.log("Choice sound failed:", e));
            
            // 显示选择反馈
            dialogueText.innerHTML = `<span class="highlight">${option.message}</span>`;
            optionsContainer.style.display = 'none';
            
            // 更新好感度
            gameData.affection += option.value;
            
            // 确保好感度在0-100范围内
            gameData.affection = Math.max(0, Math.min(100, gameData.affection));
            
            // 更新爱心显示
            updateHearts();
            
            // 3秒后继续剧情
            setTimeout(() => {
                if (gameData.storyProgress < gameData.storyLines.length) {
                    nextStoryPoint();
                } else {
                    showEnding();
                }
            }, 2000);
        }

        // 更新爱心显示
        function updateHearts() {
            const heartsCount = 10;
            const heartValue = 10; // 每颗心代表10%
            const fullHearts = Math.floor(gameData.affection / heartValue);
            const halfHeart = (gameData.affection % heartValue) >= 5 && (gameData.affection % heartValue) !== 0;
            const emptyHearts = heartsCount - fullHearts - (halfHeart ? 1 : 0);
            
            heartsDisplay.innerHTML = '';
            
            // 添加满心
            for (let i = 0; i < fullHearts; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart heart-full';
                heartsDisplay.appendChild(heart);
            }
            
            // 添加半心
            if (halfHeart) {
                const heart = document.createElement('div');
                heart.className = 'heart heart-half';
                heartsDisplay.appendChild(heart);
            }
            
            // 添加空心
            for (let i = 0; i < emptyHearts; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart heart-empty';
                heartsDisplay.appendChild(heart);
            }
            
            // 更新百分比文字
            heartsPercentage.textContent = `${gameData.affection}%`;
            
            // 更新进度条
            progressBar.style.width = `${gameData.affection}%`;
        }

        // 显示结局
        function showEnding() {
            let endingType = 'neutral';
            
            if (gameData.affection >= 85) {
                endingType = 'perfect';
            } else if (gameData.affection >= 70) {
                endingType = 'good';
            } else if (gameData.affection >= 30) {
                endingType = 'neutral';
            } else if (gameData.affection >= 15) {
                endingType = 'bad';
            } else {
                endingType = 'disaster';
            }
            
            const ending = gameData.endings[endingType];
            endingTitle.textContent = ending.title;
            endingMessage.innerHTML = ending.message;
            
            // 设置结局背景
            background.style.backgroundImage = `url('${gameData.backgrounds[ending.bg]}')`;
            
            // 播放结局音效
            endingSound.currentTime = 0;
            endingSound.play().catch(e => console.log("Ending sound failed:", e));
            
            // 如果是好结局，播放BGM
            if (endingType === 'perfect' || endingType === 'good') {
                bgm.src = './トゲナシトゲアリ - 荊の薔薇.mp3';
                bgm.currentTime = 0;
                bgm.volume = 0.5;
                bgm.play().catch(e => console.log("BGM play failed:", e));
            }
            
            endingScreen.style.display = 'flex';
        }

        // 重置游戏
        function resetGame() {
            gameData.affection = 50;
            gameData.storyProgress = 0;
            gameData.currentCharacterIndex = 0;
            gameData.currentBackground = 'classroom';
            gameData.gameStarted = false;
            gameData.gamePhase = 0;
            
            endingScreen.style.display = 'none';
            startScreen.style.display = 'flex';
            optionsContainer.style.display = 'none';
            dialogueText.style.height = '100px';
            
            // 重置背景
            background.style.backgroundImage = `url('${gameData.backgrounds.classroom}')`;
            character.style.backgroundImage = `url('${gameData.characterImages[0]}')`;
            characterExpression.style.backgroundImage = `url('${gameData.characterImages[0]}')`;
            
            // 重置好感度显示
            updateHearts();
            
            // 停止音频
            bgm.pause();
            bgm.currentTime = 0;
            bgm.src = './トゲナシトゲアリ - 荊の薔薇.mp3';
        }

        // 启动游戏
        window.onload = initGame;
    </script>
</body>
</html>
